name: Deploy to Hostinger Node.js Web Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            cd ~/domains/solarcubic.in/public_html/crm || exit 1
            git pull origin main
            npm install --production=false
            npm run build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart crm || pm2 start .next/standalone/server.js --name "crm"
            else
              touch tmp/restart.txt 2>/dev/null || true
            fi
